        description: 按分类筛选，0 表示全部。
        schema:
          type: string
      - name: campusId
        in: query
        description: 按校区筛选，0 表示全部。
        schema:
          type: string
      - name: keyword
        in: query
        schema:
          type: string
      - name: page.cursor
        in: query
        description: 上一页返回的 next_cursor，首次请求留空。
        schema:
          type: string
      - name: page.limit
        in: query
        description: 拉取条数，1~50。
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWantedReply'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - WantedService
      description: 发布求购帖。与发布商品一样要求已通过校园认证。
      operationId: WantedService_CreateWanted
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWantedRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WantedPost'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/wanted/mine:
    get:
      tags:
      - WantedService
      description: 我发布的求购帖。
      operationId: WantedService_ListMyWanted
      parameters:
      - name: page.cursor
        in: query
        description: 上一页返回的 next_cursor，首次请求留空。
        schema:
          type: string
      - name: page.limit
        in: query
        description: 拉取条数，1~50。
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWantedReply'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/wanted/{wantedId}:
    get:
      tags:
      - WantedService
      description: 查看求购帖详情。
      operationId: WantedService_GetWanted
      parameters:
      - name: wantedId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WantedPost'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/wanted/{wantedId}/close:
    post:
      tags:
      - WantedService
      description: 关闭求购帖（已找到或不再需要）。仅发帖人可调用。
      operationId: WantedService_CloseWanted
      parameters:
      - name: wantedId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseWantedRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WantedPost'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    AcceptOrderRequest:
      type: object
      properties:
        orderId:
          type: string
        meetPoiId:
          type: string
          description: 卖家确认或修改的面交地点与时间。
        meetTime:
          type: string
    AddFavoriteReply:
      type: object
      properties:
        favoriteCount:
          type: integer
          description: 收藏后的总收藏数，供前端直接更新计数而无需重新拉取。
          format: int32
    AddFavoriteRequest:
      type: object
      properties:
        productId:
          type: string
    AddSensitiveWordRequest:
      type: object
      properties:
        word:
          type: string
        category:
          enum:
          - SENSITIVE_WORD_CATEGORY_UNSPECIFIED
          - SENSITIVE_WORD_CATEGORY_PROHIBITED
          - SENSITIVE_WORD_CATEGORY_CONTACT
          - SENSITIVE_WORD_CATEGORY_ACADEMIC
          - SENSITIVE_WORD_CATEGORY_POLITICAL_PORN
          type: string
          format: enum
        level:
          type: integer
          description: 处置级别：1 告警 2 复审 3 拦截。
          format: int32
    BlockUserReply:
      type: object
      properties: {}
    BlockUserRequest:
      type: object
      properties:
        userId:
          type: string
        reason:
          enum:
          - BLOCK_REASON_UNSPECIFIED
          - BLOCK_REASON_HARASSMENT
          - BLOCK_REASON_FRAUD_SUSPECT
          - BLOCK_REASON_SPAM
          - BLOCK_REASON_OTHER
          type: string
          format: enum
    Campus:
      type: object
      properties:
        campusId:
          type: string
        schoolId:
          type: string
        name:
          type: string
        location:
          allOf:
          - $ref: '#/components/schemas/GeoPoint'
          description: 校区中心坐标，用于地图初始视野。
    CampusAuth:
      type: object
      properties:
        authId:
          type: string
        userId:
          type: string
        method:
          enum:
          - CAMPUS_AUTH_METHOD_UNSPECIFIED
          - CAMPUS_AUTH_METHOD_EDU_EMAIL
          - CAMPUS_AUTH_METHOD_STUDENT_CARD
          type: string
          format: enum
        status:
          enum:
          - CAMPUS_AUTH_STATUS_UNSPECIFIED
          - CAMPUS_AUTH_STATUS_NONE
          - CAMPUS_AUTH_STATUS_PENDING
          - CAMPUS_AUTH_STATUS_PASSED
          - CAMPUS_AUTH_STATUS_REJECTED
          - CAMPUS_AUTH_STATUS_EXPIRED
          type: string
          format: enum
        campus:
          $ref: '#/components/schemas/CampusRef'
        studentNoMasked:
          type: string
          description: 脱敏学号，如 "2021****01"。仅本人可见。
        rejectReason:
          type: string
          description: 驳回原因，status 为 REJECTED 时有值。
        verifiedAt:
          type: string
          description: 认证通过时间，Unix 秒。
        expireAt:
          type: string
          description: 认证过期时间，Unix 秒。0 表示不过期。
      description: CampusAuth 一条认证记录。
    CampusRef:
      type: object
      properties:
        campusId:
          type: string
        name:
          type: string
        school:
          $ref: '#/components/schemas/SchoolRef'
      description: CampusRef 校区摘要。校区是本平台「距离」与「同校优先」的基本单位。
    CancelOrderRequest:
      type: object
      properties:
        orderId:
          type: string
        reason:
          enum:
          - CANCEL_REASON_UNSPECIFIED
          - CANCEL_REASON_BUYER_CHANGED_MIND
          - CANCEL_REASON_SCHEDULE_CONFLICT
          - CANCEL_REASON_ITEM_MISMATCH
          - CANCEL_REASON_PEER_UNREACHABLE
          - CANCEL_REASON_OTHER
          type: string
          format: enum
        remark:
          type: string
    Category:
      type: object
      properties:
        categoryId:
          type: string
        parentId:
          type: string
          description: 父分类 ID。一级分类为 0。
        name:
          type: string
        iconKey:
          type: string
          description: 图标对象 key。
        sort:
          type: integer
          format: int32
        enabled:
          type: boolean
        children:
          type: array
          items:
            $ref: '#/components/schemas/Category'
          description: 二级分类。仅一级分类的响应中填充。
      description: Category 商品分类。
    ChangeProductStatusRequest:
      type: object
      properties:
        productId:
          type: string
        event:
          enum:
          - PRODUCT_EVENT_UNSPECIFIED
          - PRODUCT_EVENT_OFFLINE
          - PRODUCT_EVENT_REPUBLISH
          type: string
          format: enum
    CloseWantedRequest:
      type: object
      properties:
        wantedId:
          type: string
    ConfirmDoneRequest:
      type: object
      properties:
        orderId:
          type: string
    CreateImageUploadURLReply:
      type: object
      properties:
        uploadUrl:
          type: string
          description: 预签名上传地址，客户端以 PUT 上传。
        objectKey:
          type: string
          description: 对象 key，上传成功后回传给业务接口。
        headers:
          type: object
          additionalProperties:
            type: string
          description: 上传时必须携带的请求头。Content-Type 参与签名，改动会导致上传被拒。
        expireAt:
          type: string
          description: 凭证过期时间，Unix 秒。
        maxSizeBytes:
          type: string
          description: 允许的最大字节数。
    CreateImageUploadURLRequest:
      type: object
      properties:
        extension:
          type: string
          description: 文件扩展名，不含点号，如 "jpg"。仅允许图片格式。
        sizeBytes:
          type: string
          description: 文件字节数，用于服务端提前拒绝过大的文件。
        purpose:
          enum:
          - UPLOAD_PURPOSE_UNSPECIFIED
          - UPLOAD_PURPOSE_PRODUCT_IMAGE
          type: string
          format: enum
    CreateOrderRequest:
      type: object
      properties:
        productId:
          type: string
        meetPoiId:
          type: string
          description: 建议面交地点，可选。留空表示待协商。
        meetTime:
          type: string
          description: 建议面交时间，Unix 秒。可选。
        message:
          type: string
          description: 给卖家的留言，最多 200 字符。
    CreateProductRequest:
      type: object
      properties:
        title:
          type: string
          description: 商品标题，2~60 字符。禁止包含联系方式，违规会被审核驳回。
        description:
          type: string
          description: 详细描述，最多 2000 字符。
        priceCents:
          type: string
          description: 价格，单位分。0 表示免费赠送。
        originalPriceCents:
          type: string
          description: 原价，单位分。可选，用于展示「原价 ¥x」。
        condition:
          enum:
          - CONDITION_UNSPECIFIED
          - CONDITION_NEW
          - CONDITION_LIKE_NEW
          - CONDITION_LIGHTLY_USED
          - CONDITION_WELL_USED
          type: string
          format: enum
        categoryId:
          type: string
          description: 二级分类 ID。
        campusId:
          type: string
          description: 交易校区。默认取卖家认证的校区。
        poiId:
          type: string
          description: 建议面交地点的 POI ID，可选。
        imageKeys:
          type: array
          items:
            type: string
          description: 图片 object_key 列表，1~9 个。第一张为封面。
    CreateReportRequest:
      type: object
      properties:
        targetType:
          type: integer
          description: 举报对象类型，复用 moderation 的 TargetType 语义但此处独立定义避免跨文件耦合。
          format: int32
        targetId:
          type: string
        reason:
          enum:
          - REPORT_REASON_UNSPECIFIED
          - REPORT_REASON_FAKE
          - REPORT_REASON_FRAUD
          - REPORT_REASON_HARASSMENT
          - REPORT_REASON_PROHIBITED
          - REPORT_REASON_ACADEMIC_MISCONDUCT
          - REPORT_REASON_SPAM
          - REPORT_REASON_OTHER
          type: string
          format: enum
        description:
          type: string
        imageKeys:
          type: array
          items:
            type: string
          description: 证据图片的 object_key，最多 3 张。
    CreateReviewRequest:
      type: object
      properties:
        orderId:
          type: string
        score:
          type: integer
          description: "评分 1~5。\n\n 4~5 计好评、3 计中评、1~2 计差评，映射到信誉分变更\n （规则在 user-service 内，见 doc.md §9.4）。"
          format: int32
        tags:
          type: array
          items:
            enum:
            - REVIEW_TAG_UNSPECIFIED
            - REVIEW_TAG_ACCURATE_DESCRIPTION
            - REVIEW_TAG_GOOD_COMMUNICATION
            - REVIEW_TAG_PUNCTUAL
            - REVIEW_TAG_GOOD_VALUE
            - REVIEW_TAG_INACCURATE_DESCRIPTION
            - REVIEW_TAG_LATE
            - REVIEW_TAG_POOR_COMMUNICATION
            type: string
            format: enum
        content:
          type: string
        anonymous:
          type: boolean
          description: 匿名评价。仍会计入信誉分，但不展示评价者昵称。
    CreateWantedRequest:
      type: object
      properties:
        title:
          type: string
          description: 求购标题，2~60 字符。
        description:
          type: string
          description: 详细说明，最多 1000 字符。
        budgetMaxCents:
          type: string
          description: 心理价位上限，单位分。0 表示价格可议。
        categoryId:
          type: string
        campusId:
          type: string
        validDays:
          type: integer
          description: 有效天数，1~30。到期后自动置为 EXPIRED。
          format: int32
    CursorReply:
      type: object
      properties:
        nextCursor:
          type: string
          description: 下一页游标，`has_more=false` 时为空字符串。
        hasMore:
          type: boolean
          description: 是否还有更多数据。
      description: CursorReply 游标分页响应元信息。
    DecideTaskRequest:
      type: object
      properties:
        taskId:
          type: string
        pass:
          type: boolean
          description: 是否通过。
        reason:
          type: string
    DeleteProductReply:
      type: object
      properties: {}
    DeleteSensitiveWordReply:
      type: object
      properties: {}
    FacetsReply:
      type: object
      properties:
        categoryCounts:
          type: object
          additionalProperties:
            type: string
          description: 各分类的命中数量，key 为 category_id。
        conditionCounts:
          type: object
          additionalProperties:
            type: string
          description: 各成色的命中数量，key 为 Condition 的枚举值。
        campusCounts:
          type: object
          additionalProperties:
            type: string
          description: 各校区的命中数量。
        degraded:
          type: boolean
    FollowUserReply:
      type: object
      properties: {}
    FollowUserRequest:
      type: object
      properties:
        userId:
          type: string
    GeoPoint:
      type: object
      properties:
        lat:
          type: number
          description: 纬度，-90 ~ 90。
          format: double
        lng:
          type: number
          description: 经度，-180 ~ 180。
          format: double
      description: GeoPoint 经纬度坐标（WGS84）。
    HandleReportRequest:
      type: object
      properties:
        reportId:
          type: string
        actioned:
          type: boolean
          description: 是否采信举报。
        handleResult:
          type: string
    ImageRef:
      type: object
      properties:
        objectKey:
          type: string
          description: 对象存储中的 key，由上传接口返回。
        url:
          type: string
          description: 可访问的完整 URL，仅出现在响应中，请求中会被忽略。
        width:
          type: integer
          description: 原图宽度（像素），用于前端预留占位避免布局抖动。
          format: int32
        height:
          type: integer
          description: 原图高度（像素）。
          format: int32
      description: "ImageRef 图片引用。业务侧只传对象存储的 object_key，\n 由服务端拼接 CDN 域名与图片处理参数后下发 url。"
    ListBlockedReply:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserBrief'
        page:
          $ref: '#/components/schemas/CursorReply'
    ListCampusesReply:
      type: object
      properties:
        campuses:
          type: array
          items:
            $ref: '#/components/schemas/Campus'
    ListCategoriesReply:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
          description: 一级分类，children 中携带其二级分类。
    ListFavoritesReply:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductBrief'
        page:
          $ref: '#/components/schemas/CursorReply'
    ListFollowingReply:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserBrief'
        page:
          $ref: '#/components/schemas/CursorReply'
    ListOrdersReply:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        page:
          $ref: '#/components/schemas/CursorReply'
    ListPOIsReply:
      type: object
      properties:
        pois:
          type: array
          items:
            $ref: '#/components/schemas/POI'
    ListProductsReply:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductBrief'
        page:
          $ref: '#/components/schemas/CursorReply'
    ListReportsReply:
      type: object
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/Report'
        page:
          $ref: '#/components/schemas/PageReply'
    ListReviewsReply:
      type: object
      properties:
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        page:
          $ref: '#/components/schemas/CursorReply'
    ListSchoolsReply:
      type: object
      properties:
        schools:
          type: array
          items:
            $ref: '#/components/schemas/School'
        page:
          $ref: '#/components/schemas/PageReply'
    ListSensitiveWordsReply:
      type: object
      properties:
        words:
          type: array
          items:
            $ref: '#/components/schemas/SensitiveWord'
        page:
          $ref: '#/components/schemas/PageReply'
    ListTasksReply:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/ModerationTask'
        page:
          $ref: '#/components/schemas/PageReply'
    ListWantedReply:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: '#/components/schemas/WantedPost'
        page:
          $ref: '#/components/schemas/CursorReply'
    LoginByPhoneRequest:
      type: object
      properties:
        phone:
          type: string
        code:
          type: string
          description: 6 位数字验证码。
    LoginByWechatRequest:
      type: object
      properties:
        code:
          type: string
          description: 微信授权临时 code，一次性使用。
        platform:
          enum:
          - WECHAT_PLATFORM_UNSPECIFIED
          - WECHAT_PLATFORM_WEB
          - WECHAT_PLATFORM_MINIAPP
          type: string
          format: enum
    LoginReply:
      type: object
      properties:
        accessToken:
          type: string
          description: '访问令牌，放入 `Authorization: Bearer <token>`。'
        refreshToken:
          type: string
          description: 刷新令牌。Web 端由服务端写 Cookie，此字段为空；小程序端返回明文。
        expiresIn:
          type: integer
          description: access_token 剩余有效秒数。
          format: int32
        isNewUser:
          type: boolean
          description: 是否本次调用新建了账号。前端可据此引导进入校园认证流程。
        profile:
          allOf:
          - $ref: '#/components/schemas/UserProfile'
          description: 登录用户的档案摘要。
    LogoutReply:
      type: object
      properties: {}
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
    ModerationTask:
      type: object
      properties:
        taskId:
          type: string
        targetType:
          enum:
          - TARGET_TYPE_UNSPECIFIED
          - TARGET_TYPE_PRODUCT
          - TARGET_TYPE_WANTED
          - TARGET_TYPE_MESSAGE
          - TARGET_TYPE_USER_PROFILE
          type: string
          format: enum
        targetId:
          type: string
        ownerId:
          type: string
          description: 内容所属用户，用于统计某用户的违规频次。
        status:
          enum:
          - TASK_STATUS_UNSPECIFIED
          - TASK_STATUS_AUTO_PASSED
          - TASK_STATUS_AUTO_REJECTED
          - TASK_STATUS_PENDING
          - TASK_STATUS_MANUAL_PASSED
          - TASK_STATUS_MANUAL_REJECTED
          type: string
          format: enum
        autoLevel:
          enum:
          - MODERATION_LEVEL_UNSPECIFIED
          - MODERATION_LEVEL_WARN
          - MODERATION_LEVEL_REVIEW
          - MODERATION_LEVEL_BLOCK
          type: string
          description: 自动审核命中的处置级别。
          format: enum
        hitWords:
          type: array
          items:
            type: string
        content:
          type: string
          description: 送审内容摘要，供人工审核时查看。
        reviewerId:
          type: string
        rejectReason:
          type: string
        createdAt:
          type: string
        decidedAt:
          type: string
      description: ModerationTask 一条审核记录。
    Order:
      type: object
      properties:
        orderId:
          type: string
        productId:
          type: string
        buyerId:
          type: string
        sellerId:
          type: string
        priceCents:
          type: string
          description: "PriceCents 成交价快照，单位分。\n\n 在锁定商品的那一刻固定下来，之后卖家改价不影响本单——\n 否则买家会在面交时发现价格变了。"
        payChannel:
          enum:
          - PAY_CHANNEL_UNSPECIFIED
          - PAY_CHANNEL_OFFLINE
          type: string
          format: enum
        status:
          enum:
          - ORDER_STATUS_UNSPECIFIED
          - ORDER_STATUS_PENDING_SELLER
          - ORDER_STATUS_ACCEPTED
          - ORDER_STATUS_AWAITING_PEER
          - ORDER_STATUS_COMPLETED
          - ORDER_STATUS_REJECTED
          - ORDER_STATUS_CANCELLED
          - ORDER_STATUS_EXPIRED
          type: string
          format: enum
        meetPoiId:
          type: string
          description: 面交约定。
        meetTime:
          type: string
        buyerMessage:
          type: string
          description: 买家下单时的留言。
        buyerConfirmed:
          type: boolean
          description: 已确认完成的一方。双方都确认后转为 COMPLETED。
        sellerConfirmed:
          type: boolean
        cancelReason:
          enum:
          - CANCEL_REASON_UNSPECIFIED
          - CANCEL_REASON_BUYER_CHANGED_MIND
          - CANCEL_REASON_SCHEDULE_CONFLICT
          - CANCEL_REASON_ITEM_MISMATCH
          - CANCEL_REASON_PEER_UNREACHABLE
          - CANCEL_REASON_OTHER
          type: string
          description: 取消/拒绝的原因。
          format: enum
