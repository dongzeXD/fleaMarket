    get:
      tags:
      - SearchService
      description: 关键词搜索 + 多维筛选。
      operationId: SearchService_SearchProducts
      parameters:
      - name: keyword
        in: query
        description: 关键词，最多 50 字符。留空时等同于按筛选条件浏览。
        schema:
          type: string
      - name: filter.minPriceCents
        in: query
        description: 价格下限（分），含。
        schema:
          type: string
      - name: filter.maxPriceCents
        in: query
        description: 价格上限（分），含。0 表示不限。
        schema:
          type: string
      - name: filter.conditions
        in: query
        description: 成色，多选。留空表示不限。
        schema:
          type: array
          items:
            enum:
            - CONDITION_UNSPECIFIED
            - CONDITION_NEW
            - CONDITION_LIKE_NEW
            - CONDITION_LIGHTLY_USED
            - CONDITION_WELL_USED
            type: string
            format: enum
      - name: filter.categoryIds
        in: query
        description: 分类，多选。
        schema:
          type: array
          items:
            type: string
      - name: filter.campusIds
        in: query
        description: 校区，多选。留空时结合 campus_id 做同校优先。
        schema:
          type: array
          items:
            type: string
      - name: filter.onlyAvailable
        in: query
        description: "仅看在售（排除已预订）。默认 false，即在售与已预订都展示——\n 已预订的商品对买家仍有价值：预订可能被取消。"
        schema:
          type: boolean
      - name: sort
        in: query
        schema:
          enum:
          - FEED_SORT_UNSPECIFIED
          - FEED_SORT_LATEST
          - FEED_SORT_HOT
          - FEED_SORT_DISTANCE
          - FEED_SORT_PRICE_ASC
          - FEED_SORT_PRICE_DESC
          type: string
          format: enum
      - name: campusId
        in: query
        description: 观察者所在校区，用于同校优先。
        schema:
          type: string
      - name: page.cursor
        in: query
        description: 上一页返回的 next_cursor，首次请求留空。
        schema:
          type: string
      - name: page.limit
        in: query
        description: 拉取条数，1~50。
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchReply'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
