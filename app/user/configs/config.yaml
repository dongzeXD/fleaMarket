server:
  http:
    addr: 0.0.0.0:8001
    timeout: 3s
  grpc:
    addr: 0.0.0.0:9001
    timeout: 3s

data:
  database:
    # 凭据不写入配置文件，由环境变量注入。此处默认值仅用于本地 docker-compose。
    source: ${DB_SOURCE:fleamarket:fleamarket@tcp(127.0.0.1:3306)/fleamarket?charset=utf8mb4&parseTime=True&loc=Local}
    max_open_conns: 50
    max_idle_conns: 10
    conn_max_lifetime: 3600s
    slow_threshold: 0.2s
    debug: true
  redis:
    addr: ${REDIS_ADDR:127.0.0.1:6379}
    password: ${REDIS_PASSWORD:}
    db: 0
    pool_size: 20
    read_timeout: 0.2s
    write_timeout: 0.2s
    # 多环境共用 Redis 实例时用于隔离。
    key_prefix: ${REDIS_PREFIX:fleamarket:dev:user}

registry:
  etcd:
    endpoints:
      - ${ETCD_ENDPOINT:127.0.0.1:2379}
    dial_timeout: 5s
    # 必须按环境隔离：若 dev 与 prod 共用前缀，
    # 开发机启动的实例会被生产流量发现并调用。
    namespace: ${ETCD_NAMESPACE:/fleamarket/dev}
    ttl: 15s

observability:
  environment: ${APP_ENV:dev}
  log:
    level: ${LOG_LEVEL:debug}
    format: ${LOG_FORMAT:text}
    add_source: true
  trace:
    # 布尔字段不能用 ${VAR:default} 占位：kratos 的环境变量替换产出字符串，
    # 而 protojson 对 bool 只接受 true/false 字面量。需要按环境切换时
    # 用独立的 config 文件覆盖，而不是环境变量。
    enabled: false
    endpoint: ${OTLP_ENDPOINT:127.0.0.1:4318}
    sample_ratio: 1.0
    insecure: true

auth:
  # 注意 Duration 必须写成 protobuf JSON 的秒数形式（如 7200s），
  # "2h" 这类 Go duration 写法会被 protojson 拒绝。
  # 至少 32 字节，否则服务拒绝启动。生产环境必须由密钥管理服务注入。
  jwt_secret: ${JWT_SECRET:dev-only-jwt-secret-at-least-32-bytes-long}
  access_ttl: 7200s
  refresh_ttl: 2592000s

crypto:
  # 两把密钥必须不同。field_enc_key 需为 16/24/32 字节。
  # 生产务必更换；轮换前需先迁移已有数据，否则历史手机号将无法解密。
  field_enc_key: ${FIELD_ENC_KEY:dev-only-aes-key-32-bytes-long!!}
  field_hmac_key: ${FIELD_HMAC_KEY:dev-only-hmac-key-differs-from-aes}

storage:
  endpoint: ${S3_ENDPOINT:127.0.0.1:9000}
  access_key: ${S3_ACCESS_KEY:fleamarket}
  secret_key: ${S3_SECRET_KEY:fleamarket}
  use_ssl: false
  region: ""
  bucket: ${S3_BUCKET:fleamarket-private}
  # 留空则签发带有效期的私有链接；生产应配 CDN 域名，
  # 否则签名 URL 每次都不同，CDN 缓存会完全失效。
  public_base_url: ${S3_PUBLIC_BASE_URL:}
  process_query_key: x-oss-process

sms:
  # console 表示验证码打印到日志，本地开发无需申请短信服务。
  provider: ${SMS_PROVIDER:console}
  access_key: ${SMS_ACCESS_KEY:}
  secret_key: ${SMS_SECRET_KEY:}
  sign_name: ${SMS_SIGN_NAME:校园跳蚤市场}
  template_code: ${SMS_TEMPLATE_CODE:}
  resend_interval: 60s
  daily_limit: 10

email:
  # console 表示认证链接打印到日志。
  provider: ${EMAIL_PROVIDER:console}
  host: ${EMAIL_HOST:}
  port: ${EMAIL_PORT:587}
  username: ${EMAIL_USERNAME:}
  password: ${EMAIL_PASSWORD:}
  from: ${EMAIL_FROM:no-reply@example.com}
  from_name: 校园跳蚤市场
  use_tls: true

wechat:
  web:
    app_id: ${WECHAT_WEB_APP_ID:}
    app_secret: ${WECHAT_WEB_APP_SECRET:}
  mini_app:
    app_id: ${WECHAT_MINI_APP_ID:}
    app_secret: ${WECHAT_MINI_APP_SECRET:}
  timeout: 3s

business:
  # 认证回调链接前缀，随部署域名变化。
  campus_auth_verify_url: ${CAMPUS_AUTH_VERIFY_URL:http://localhost:3000/campus-auth/verify}
  # 雪花 ID 节点号。多实例部署时必须各不相同，否则会产生重复 ID。
  worker_id: ${WORKER_ID:1}
  mq_namespace: ${MQ_NAMESPACE:fleamarket:dev}
