name: fleamarket

services:
  mysql:
    image: mysql:8.0
    container_name: fm-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max-connections=500
    environment:
      MYSQL_ROOT_PASSWORD: fleamarket
      MYSQL_DATABASE: fleamarket
      MYSQL_USER: fleamarket
      MYSQL_PASSWORD: fleamarket
    ports:
      - "3306:3306"
    volumes:
      - ./.data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ufleamarket", "-pfleamarket"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: fm-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  etcd:
    image: bitnami/etcd:3.5
    container_name: fm-etcd
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    ports:
      - "2379:2379"
    volumes:
      - ./.data/etcd:/bitnami/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: fm-meilisearch
    environment:
      MEILI_MASTER_KEY: fleamarket_dev_master_key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - ./.data/meili:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: fm-minio
    command: ["server", "/data", "--console-address", ":9090"]
    environment:
      MINIO_ROOT_USER: fleamarket
      MINIO_ROOT_PASSWORD: fleamarket
    ports:
      - "9000:9000"
      - "9090:9090"
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 fleamarket fleamarket &&
      mc mb -p local/fleamarket-public &&
      mc anonymous set download local/fleamarket-public &&
      mc mb -p local/fleamarket-private &&
      echo 'minio buckets ready'
      "
