openapi: 3.0.3
info:
  title: 校园跳蚤市场 API
  description: 校园二手交易平台对外 HTTP API。全部接口经 api-gateway 暴露，需在 Authorization 头携带 Bearer access_token（登录与学校字典类接口除外）。
  version: v1
paths:
  /v1/admin/moderation/tasks:
    get:
      tags:
      - ModerationService
      description: 人工审核工单列表。供 admin 后台。
      operationId: ModerationService_ListTasks
      parameters:
      - name: status
        in: query
        description: 只看某状态，0 表示全部（但默认应传 PENDING 看待处理工单）。
        schema:
          enum:
          - TASK_STATUS_UNSPECIFIED
          - TASK_STATUS_AUTO_PASSED
          - TASK_STATUS_AUTO_REJECTED
          - TASK_STATUS_PENDING
          - TASK_STATUS_MANUAL_PASSED
          - TASK_STATUS_MANUAL_REJECTED
          type: string
          format: enum
      - name: targetType
        in: query
        schema:
          enum:
          - TARGET_TYPE_UNSPECIFIED
          - TARGET_TYPE_PRODUCT
          - TARGET_TYPE_WANTED
          - TARGET_TYPE_MESSAGE
          - TARGET_TYPE_USER_PROFILE
          type: string
          format: enum
      - name: page.page
        in: query
        description: 页码，从 1 开始。
        schema:
          type: integer
          format: int32
      - name: page.pageSize
        in: query
        description: 每页条数，1~100。
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTasksReply'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/admin/moderation/tasks/{taskId}/decide:
    post:
      tags:
      - ModerationService
      description: 处置人工审核工单。供 admin 后台。
      operationId: ModerationService_DecideTask
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideTaskRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationTask'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/admin/reports:
    get:
      tags:
      - ReportService
      description: 举报工单列表。供 admin 后台。
      operationId: ReportService_ListReports
      parameters:
      - name: status
        in: query
        schema:
          enum:
          - REPORT_STATUS_UNSPECIFIED
          - REPORT_STATUS_PENDING
          - REPORT_STATUS_ACTIONED
          - REPORT_STATUS_DISMISSED
          type: string
          format: enum
      - name: page.page
        in: query
        description: 页码，从 1 开始。
        schema:
          type: integer
          format: int32
      - name: page.pageSize
        in: query
        description: 每页条数，1~100。
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListReportsReply'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/admin/reports/{reportId}/handle:
    post:
      tags:
      - ReportService
      description: 处置举报。供 admin 后台。
      operationId: ReportService_HandleReport
      parameters:
      - name: reportId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandleReportRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/admin/sensitive-words:
    get:
      tags:
      - ReportService
      description: 敏感词列表。供 admin 后台。
      operationId: ReportService_ListSensitiveWords
      parameters:
      - name: category
        in: query
        schema:
          enum:
          - SENSITIVE_WORD_CATEGORY_UNSPECIFIED
          - SENSITIVE_WORD_CATEGORY_PROHIBITED
          - SENSITIVE_WORD_CATEGORY_CONTACT
          - SENSITIVE_WORD_CATEGORY_ACADEMIC
          - SENSITIVE_WORD_CATEGORY_POLITICAL_PORN
          type: string
          format: enum
      - name: page.page
        in: query
        description: 页码，从 1 开始。
        schema:
          type: integer
          format: int32
      - name: page.pageSize
        in: query
        description: 每页条数，1~100。
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSensitiveWordsReply'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - ReportService
      description: 新增敏感词。变更后经 Pub/Sub 通知各实例热更新词库。
      operationId: ReportService_AddSensitiveWord
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSensitiveWordRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensitiveWord'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/admin/sensitive-words/{wordId}:
    delete:
      tags:
      - ReportService
      description: 删除敏感词。
      operationId: ReportService_DeleteSensitiveWord
      parameters:
      - name: wordId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSensitiveWordReply'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/login/phone:
    post:
      tags:
      - AuthService
      description: 手机号验证码登录。账号不存在时自动注册并直接登录。
      operationId: AuthService_LoginByPhone
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginByPhoneRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginReply'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/login/wechat:
    post:
      tags:
      - AuthService
      description: 微信登录。传入微信授权返回的临时 code。
      operationId: AuthService_LoginByWechat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginByWechatRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginReply'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/logout:
    post:
      tags:
      - AuthService
      description: 退出登录，服务端将 refresh_token 加入吊销名单。
      operationId: AuthService_Logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutReply'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/refresh:
    post:
      tags:
      - AuthService
      description: 用 refresh_token 换取新的 access_token。
      operationId: AuthService_RefreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginReply'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/sms-code:
    post:
      tags:
      - AuthService
      description: "发送短信验证码。\n\n 限流：同一手机号 60 秒内仅可发送一次，单日上限 10 次。\n 出于账号枚举防护，无论手机号是否已注册均返回成功。"
      operationId: AuthService_SendSmsCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendSmsCodeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendSmsCodeReply'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/campus-auth/email:
    post:
      tags:
      - CampusAuthService
      description: "发起校园邮箱认证。\n\n 服务端校验邮箱域名后缀命中该校白名单后，发送一封含签名链接的邮件，\n 链接 30 分钟内有效且仅可使用一次。"
      operationId: CampusAuthService_StartEmailAuth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartEmailAuthRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartEmailAuthReply'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/campus-auth/email/verify:
    get:
      tags:
      - CampusAuthService
      description: 校验邮箱认证链接中的 token，成功后认证状态置为通过。
      operationId: CampusAuthService_VerifyEmailAuth
      parameters:
      - name: token
        in: query
        description: 邮件链接中携带的签名 token。
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailAuthReply'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/campus-auth/me:
    get:
      tags:
      - CampusAuthService
      description: 查询当前用户的认证状态与驳回原因。
      operationId: CampusAuthService_GetMyCampusAuth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampusAuth'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/campus-auth/student-card:
    post:
      tags:
      - CampusAuthService
      description: 提交学号认证材料，进入人工审核队列。
      operationId: CampusAuthService_SubmitStudentCardAuth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitStudentCardAuthRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitStudentCardAuthReply'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/campuses/{campusId}/pois:
    get:
      tags:
      - CategoryService
      description: 查询某校区的面交地点。用于发布时选点与地图展示。
      operationId: CategoryService_ListPOIs
      parameters:
      - name: campusId
        in: path
        required: true
        schema:
          type: string
      - name: types
        in: query
        description: 按类型筛选，留空返回全部。
        schema:
          type: array
          items:
            enum:
            - POI_TYPE_UNSPECIFIED
            - POI_TYPE_GATE
            - POI_TYPE_DORM
            - POI_TYPE_CANTEEN
            - POI_TYPE_LIBRARY
            - POI_TYPE_TEACHING_BUILDING
            - POI_TYPE_PARCEL_STATION
            - POI_TYPE_OTHER
            type: string
            format: enum
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPOIsReply'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/categories:
    get:
      tags:
      - CategoryService
      description: 查询完整分类树。公开接口，前端可长期缓存。
      operationId: CategoryService_ListCategories
      parameters:
      - name: enabledOnly
        in: query
        description: 为 true 时只返回启用的分类。管理后台传 false 以查看全部。
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCategoriesReply'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/favorites:
    get:
      tags:
      - FavoriteService
      description: 我的收藏列表。
      operationId: FavoriteService_ListFavorites
      parameters:
      - name: page.cursor
        in: query
        description: 上一页返回的 next_cursor，首次请求留空。
        schema:
          type: string
      - name: page.limit
        in: query
        description: 拉取条数，1~50。
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFavoritesReply'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/feed:
    get:
      tags:
      - SearchService
      description: "首页信息流。\n\n 「同校优先」由服务端按配额交错实现，不依赖搜索引擎的相关度评分：\n 三路查询（同校区 / 同校异校区 / 全局）按固定比例填充，\n 结果是确定性且可解释的，不会因评分波动而失效。"
      operationId: SearchService_Feed
      parameters:
      - name: sort
        in: query
        schema:
          enum:
          - FEED_SORT_UNSPECIFIED
          - FEED_SORT_LATEST
          - FEED_SORT_HOT
          - FEED_SORT_DISTANCE
          - FEED_SORT_PRICE_ASC
          - FEED_SORT_PRICE_DESC
          type: string
          format: enum
      - name: categoryId
        in: query
        description: 按一级或二级分类过滤，0 表示不限。
        schema:
          type: string
      - name: campusId
        in: query
        description: 观察者所在校区。未登录时由客户端传入或留空表示不做同校优先。
        schema:
          type: string
      - name: page.cursor
        in: query
        description: 上一页返回的 next_cursor，首次请求留空。
        schema:
          type: string
      - name: page.limit
        in: query
        description: 拉取条数，1~50。
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchReply'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/orders:
    get:
      tags:
      - OrderService
      description: 我的交易记录。可按角色与状态筛选。
      operationId: OrderService_ListMyOrders
      parameters:
      - name: role
        in: query
        schema:
          enum:
          - ORDER_ROLE_UNSPECIFIED
          - ORDER_ROLE_BUYER
          - ORDER_ROLE_SELLER
          type: string
          format: enum
      - name: statuses
        in: query
        description: 按状态筛选，留空表示全部。
        schema:
          type: array
          items:
            enum:
            - ORDER_STATUS_UNSPECIFIED
            - ORDER_STATUS_PENDING_SELLER
            - ORDER_STATUS_ACCEPTED
            - ORDER_STATUS_AWAITING_PEER
            - ORDER_STATUS_COMPLETED
            - ORDER_STATUS_REJECTED
            - ORDER_STATUS_CANCELLED
            - ORDER_STATUS_EXPIRED
            type: string
            format: enum
      - name: page.cursor
        in: query
        description: 上一页返回的 next_cursor，首次请求留空。
        schema:
          type: string
      - name: page.limit
        in: query
        description: 拉取条数，1~50。
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrdersReply'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - OrderService
      description: "发起预订。\n\n 商品会被原子地锁定为「已预订」，其他买家无法再预订\n （由 product-service 的 CAS 更新保证）。"
      operationId: OrderService_CreateOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/orders/{orderId}:
    get:
      tags:
      - OrderService
      description: 查看订单详情。仅买卖双方可见。
      operationId: OrderService_GetOrder
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/orders/{orderId}/accept:
    post:
      tags:
      - OrderService
      description: 卖家接受预订。
      operationId: OrderService_AcceptOrder
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptOrderRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/orders/{orderId}/cancel:
    post:
      tags:
      - OrderService
      description: "取消订单。买卖双方都可发起。\n\n 买家在卖家已接受后取消会扣信誉分——占用了商品又不履约，\n 对卖家和其他潜在买家都造成了损失（doc.md §9.4）。"
      operationId: OrderService_CancelOrder
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/orders/{orderId}/done:
    post:
      tags:
      - OrderService
      description: "确认交易完成。\n\n 需双方都确认：单方确认后进入等待对方状态，\n 72 小时内对方未确认则自动完成（doc.md §9.4）。\n 这样设计是因为线下交易平台无法验证货物是否真的交付，\n 只能依赖双方确认，同时用自动完成兜住「一方忘记点」的情况。"
      operationId: OrderService_ConfirmDone
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmDoneRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/orders/{orderId}/meetup:
    patch:
      tags:
      - OrderService
      description: 约定或修改面交时间地点。双方均可提议，对方可见。
      operationId: OrderService_UpdateMeetup
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeetupRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/orders/{orderId}/reject:
    post:
      tags:
      - OrderService
      description: 卖家拒绝预订。商品恢复在售。
      operationId: OrderService_RejectOrder
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
