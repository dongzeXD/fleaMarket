syntax = "proto3";

// user.v1 用户与身份域。
package user.v1;

option go_package = "github.com/fleamarket/api/user/v1;userv1";

import "google/api/annotations.proto";
import "buf/validate/validate.proto";
// UserProfile 定义在 user.proto。包内跨文件引用同样需要显式 import。
import "user/v1/user.proto";

// AuthService 负责账号注册与登录，签发访问凭证。
//
// 支持两种登录方式，二者通过 `wx_unionid` 归一到同一账号：
//   1. 手机号 + 短信验证码
//   2. 微信一键登录（Web 端走开放平台扫码，小程序端走 code2session）
//
// 令牌策略：access_token 有效期 2 小时，由客户端保存在内存；
// refresh_token 有效期 30 天，由服务端写入 httpOnly Cookie，避免 XSS 窃取长期凭证。
service AuthService {
  // 发送短信验证码。
  //
  // 限流：同一手机号 60 秒内仅可发送一次，单日上限 10 次。
  // 出于账号枚举防护，无论手机号是否已注册均返回成功。
  rpc SendSmsCode(SendSmsCodeRequest) returns (SendSmsCodeReply) {
    option (google.api.http) = {
      post: "/v1/auth/sms-code"
      body: "*"
    };
  }

  // 手机号验证码登录。账号不存在时自动注册并直接登录。
  rpc LoginByPhone(LoginByPhoneRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/v1/auth/login/phone"
      body: "*"
    };
  }

  // 微信登录。传入微信授权返回的临时 code。
  rpc LoginByWechat(LoginByWechatRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/v1/auth/login/wechat"
      body: "*"
    };
  }

  // 用 refresh_token 换取新的 access_token。
  rpc RefreshToken(RefreshTokenRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/v1/auth/refresh"
      body: "*"
    };
  }

  // 退出登录，服务端将 refresh_token 加入吊销名单。
  rpc Logout(LogoutRequest) returns (LogoutReply) {
    option (google.api.http) = {
      post: "/v1/auth/logout"
      body: "*"
    };
  }
}

// SmsScene 短信验证码用途。区分场景可防止验证码被跨场景重放。
enum SmsScene {
  SMS_SCENE_UNSPECIFIED = 0;
  // 登录/注册。
  SMS_SCENE_LOGIN = 1;
  // 更换绑定手机号。
  SMS_SCENE_REBIND = 2;
}

message SendSmsCodeRequest {
  // 中国大陆手机号，11 位数字。
  string phone = 1 [(buf.validate.field).string.pattern = "^1[3-9]\\d{9}$"];
  // 验证码用途。
  SmsScene scene = 2 [(buf.validate.field).enum.defined_only = true];
}

message SendSmsCodeReply {
  // 距离可再次发送的剩余秒数。
  int32 retry_after_seconds = 1;
}

message LoginByPhoneRequest {
  string phone = 1 [(buf.validate.field).string.pattern = "^1[3-9]\\d{9}$"];
  // 6 位数字验证码。
  string code = 2 [(buf.validate.field).string.pattern = "^\\d{6}$"];
}

// WechatPlatform 微信授权来源，决定服务端用哪一组 AppID/AppSecret 兑换。
enum WechatPlatform {
  WECHAT_PLATFORM_UNSPECIFIED = 0;
  // 网站应用（开放平台扫码登录）。
  WECHAT_PLATFORM_WEB = 1;
  // 微信小程序。
  WECHAT_PLATFORM_MINIAPP = 2;
}

message LoginByWechatRequest {
  // 微信授权临时 code，一次性使用。
  string code = 1 [(buf.validate.field).string.min_len = 1];
  WechatPlatform platform = 2 [(buf.validate.field).enum.defined_only = true];
}

message RefreshTokenRequest {
  // 留空时服务端从 httpOnly Cookie 读取。
  string refresh_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutReply {}

message LoginReply {
  // 访问令牌，放入 `Authorization: Bearer <token>`。
  string access_token = 1;
  // 刷新令牌。Web 端由服务端写 Cookie，此字段为空；小程序端返回明文。
  string refresh_token = 2;
  // access_token 剩余有效秒数。
  int32 expires_in = 3;
  // 是否本次调用新建了账号。前端可据此引导进入校园认证流程。
  bool is_new_user = 4;
  // 登录用户的档案摘要。
  UserProfile profile = 5;
}
