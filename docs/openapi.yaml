tags:
- name: AuthService
  description: "AuthService 负责账号注册与登录，签发访问凭证。\n\n 支持两种登录方式，二者通过 `wx_unionid` 归一到同一账号：\n   1. 手机号 + 短信验证码\n   2. 微信一键登录（Web\
    \ 端走开放平台扫码，小程序端走 code2session）\n\n 令牌策略：access_token 有效期 2 小时，由客户端保存在内存；\n refresh_token 有效期 30 天，由服务端写入 httpOnly Cookie，避免\
    \ XSS 窃取长期凭证。"
- name: CampusAuthService
  description: "CampusAuthService 校园身份认证。\n\n 这是整个平台的信任基石：未通过认证的账号只能浏览，不能发布商品、不能发起会话。\n 提供两条认证路径，校园邮箱可自动通过，学号需人工审核。"
- name: CategoryService
  description: "CategoryService 分类体系与校园地点字典。\n\n 分类是两级结构：一级用于导航分区，二级是商品实际挂载的叶子节点。\n 不做更深层级——校园二手的品类有限，三级分类只会让用户在选择时迷路。"
- name: FavoriteService
  description: "FavoriteService 收藏。\n\n 收藏除了「稍后再看」，还承担降价与上新提醒的订阅关系：\n 收藏后卖家改价会触发通知（doc.md §9.7）。"
- name: ModerationService
  description: "ModerationService 内容审核。\n\n 审核分两层（doc.md §9.6）：\n   - 自动审核：AC 自动机敏感词匹配。BLOCK 级直接驳回，\n     REVIEW 级转人工，无命中则自动通过。\n\
    \   - 人工审核：由运营在 admin 后台处理转人工的工单。\n\n SubmitProduct 等提交接口是内部接口，由各业务服务调用；\n 工单处置接口供 admin-service 调用。"
- name: OrderService
  description: "OrderService 预订与交易流程。\n\n 本平台以线下当面交易为主，不引入资金托管（doc.md §1.3）。\n 因此「订单」的实质是一个预订凭证 + 面交约定，而非支付单据：\n 它解决的是「避免多人重复问同一件商品」和「双方对时间地点有共识」。\n\
    \n 状态机（doc.md §9.4）：\n\n   PENDING_SELLER ──accept──> ACCEPTED ──buyer_done/seller_done──> AWAITING_PEER\n        │  \
    \                      │                                      │\n        ├─reject──> REJECTED     ├─cancel──> CANCELLED\
    \                  └─peer_done──> COMPLETED\n        └─timeout──> EXPIRED     └─timeout──> EXPIRED"
- name: ProductService
  description: "ProductService 商品的发布与生命周期管理。\n\n 状态机（doc.md §9.2）：\n\n   PENDING_REVIEW ──pass──> ON_SALE ──reserve──> RESERVED\
    \ ──complete──> SOLD\n        │                      │                    │\n        └──reject──> REJECTED  └──offline──>\
    \ OFFLINE └──cancel──> ON_SALE\n                                    │\n                                    └──republish──>\
    \ PENDING_REVIEW\n\n 发布前置条件：调用方必须已通过校园认证，否则返回 403 CAMPUS_AUTH_REQUIRED。"
- name: ReportService
  description: ReportService 举报与敏感词库管理。
- name: ReviewService
  description: "ReviewService 双向评价。\n\n 只有完成的订单可以评价，且买卖双方各评一次（doc.md §9.4）。\n 评价结果会转成信誉分变更，因此它是平台信任体系的数据来源。"
- name: SearchService
  description: "SearchService 商品检索。\n\n 索引由本服务消费 product.* 事件异步维护（doc.md §9.3），\n 因此存在秒级延迟——刚发布的商品可能短时间内搜不到。\n 这是可接受的：商品详情页走\
    \ product-service 直读，分享链接立即可用。"
- name: UserService
  description: "UserService 用户档案、社交关系与信誉分。\n\n 其中 BatchGetUserBrief / IsBlocked / AdjustCredit 为服务间内部接口，\n 不暴露 HTTP 注解，仅供其他微服务通过\
    \ gRPC 调用。"
- name: WantedService
  description: "WantedService 求购帖，即反向发布的「我想要」。\n\n 为什么需要它：校园二手的供给是零散且偶然的——某本教材此刻没人在卖，\n 但下周可能就有人清书架。求购帖让需求可被看见，把「等运气」变成「等匹配」。"
